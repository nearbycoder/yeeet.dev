name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the lockfile npm version
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
