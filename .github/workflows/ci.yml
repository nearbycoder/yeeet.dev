name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yeeet
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: yeeet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yeeet -d yeeet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://yeeet:integration-test-only@localhost:5432/yeeet_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use the lockfile npm version
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
